<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Huichuan Li</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF8;--ink:#131417;--muted:#5C5F68;--signal:#2B31A8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--paper:#121316;--ink:#EDEBE7;--muted:#9EA1A8;--signal:#A3A9F5}
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100%;background:var(--paper);color:var(--ink);
    font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.6;
    display:flex;align-items:center;
  }
  html,body{height:100%}
  main{max-width:36rem;margin:0 auto;padding:2rem 1.75rem}
  h1{
    font-family:"Archivo",system-ui,sans-serif;font-weight:700;
    font-size:clamp(2rem,6vw,3rem);letter-spacing:-.03em;margin:0 0 1rem;line-height:1.05;
  }
  p{color:var(--muted);margin:0 0 1.75rem;max-width:44ch}
  a{
    font-family:"Archivo",system-ui,sans-serif;font-weight:600;
    color:var(--signal);text-decoration:none;
    border-bottom:1.5px solid transparent;transition:border-color .15s ease;
  }
  a:hover{border-bottom-color:var(--signal)}
  :focus-visible{outline:2px solid var(--signal);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Nothing here</h1>
  <p>That page doesn't exist. It may have been moved, or the link may be wrong.</p>
  <a href="/">Back to the homepage</a>
</main>
</body>
</html>
